Chiều ngày 7/5/1954, tướng De Castries cùng toàn bộ bộ chỉ huy Pháp ra hàng, lá cờ Quyết chiến Quyết thắng tung bay rực rỡ, buộc Pháp ký Hiệp định Giơ-ne-vơ.`,xpReward:180,isUnlocked:!1,questions:[{id:`q-hist-1954-1`,type:`multiple_choice`,question:`Chiến dịch Điện Biên Phủ kéo dài trong bao nhiêu ngày đêm?`,options:[`56 ngày đêm`,`30 ngày đêm`,`81 ngày đêm`,`100 ngày đêm`],correctAnswer:`56 ngày đêm`,hint:`Từ ngày 13/3/1954 đến ngày 7/5/1954 qua 3 đợt tiến công mãnh liệt.`,explanation:`56 ngày đêm ròng rã chiến đấu anh dũng đã lập nên mốc son chói lọi trong lịch sử dân tộc.`,xp:55}]},{id:`ms-1975`,year:1975,title:`Đại thắng mùa Xuân 1975`,heroName:`Quân và Dân Việt Nam`,shortDesc:`Chiến dịch Hồ Chí Minh lịch sử, non sông thu về một mối.`,secretCode:`HO CHI MINH 1975`,fullStory:`Vào lúc 11 giờ 30 phút ngày 30 tháng 4 năm 1975, chiếc xe tăng mang số hiệu 390 và 843 húc đổ cánh cổng Dinh Độc Lập.
Lá cờ Mặt trận Dân tộc Giải phóng miền Nam Việt Nam tung bay trên nóc dinh, đánh dấu Chiến dịch Hồ Chí Minh toàn thắng. Đất nước hoàn toàn giải phóng, non sông liền một dải, mở ra kỷ nguyên độc lập, thống nhất và đi lên chủ nghĩa xã hội.`,xpReward:200,isUnlocked:!1,questions:[{id:`q-hist-1975-1`,type:`multiple_choice`,question:`Chiếc xe tăng đầu tiên húc đổ cánh cổng chính của Dinh Độc Lập trưa ngày 30/4/1975 mang số hiệu bao nhiêu?`,options:[`Xe tăng 390`,`Xe tăng 843`,`Xe tăng 980`,`Xe tăng 555`],correctAnswer:`Xe tăng 390`,hint:`Do Trung úy Vũ Đăng Toàn chỉ huy đi ngay sau xe 843 rẽ vào húc đổ cổng chính.`,explanation:`Xe tăng T-59 số hiệu 390 đã húc tung cánh cổng chính Dinh Độc Lập, tiến vào sân cắm cờ chiến thắng.`,xp:60}]}],$e=[{id:`blog-1`,title:`Những sự thật thú vị về Kim Tự Tháp mà sách giáo khoa chưa kể`,slug:`nhung-su-that-thu-vi-ve-kim-tu-thap`,excerpt:`Làm thế nào người Ai Cập cổ đại vận chuyển những tảng đá 2,5 tấn băng qua sa mạc? Liệu có phải nô lệ là những người xây dựng?`,tags:[`#LịchSửThếGiới`,`#BíẨnCổĐại`,`#AiCập`],author:`HIGEOEDU Explorer`,date:`28/09/2026`,readTime:`5 phút đọc`,coverGradient:`from-amber-600 via-orange-500 to-yellow-400`,icon:`🏛️`,relatedSubject:`history`,keyTakeaways:[`Kim tự tháp Giza được xây dựng bởi các công nhân lành nghề và được đãi ngộ chu đáo bằng bánh mì, bia và thịt bò.`,`Người Ai Cập làm ướt cát trước xe trượt để giảm ma sát tới 50%, giúp kéo đá dễ dàng hơn.`,`Các cạnh của Đại Kim Tự Tháp thẳng hàng với 4 phương chính của la bàn với sai số dưới 0,05 độ!`],content:[`Khi nhắc đến Kim Tự Tháp Giza, hầu hết chúng ta đều nghĩ ngay đến những khối đá khổng lồ sừng sững giữa sa mạc cát vàng Ai Cập. Nhưng có những bí ẩn khảo cổ học hiện đại đã lật ngược những suy nghĩ thông thường!`,`Trước hết, trái với truyền thuyết cho rằng kim tự tháp được xây bằng mồ hôi và máu của hàng chục vạn nô lệ bị áp bức, các phát hiện khảo cổ học tại "Làng công nhân Giza" cho thấy những người thợ xây kim tự tháp là công nhân tự do có tay nghề cao.`,`Họ được chôn cất trong các ngôi mộ danh dự gần lăng mộ pharaon, được cấp phát thực phẩm dinh dưỡng cao gồm bia lúa mạch, bánh mì tươi và thịt bò – khẩu phần ăn mà ngay cả thường dân Ai Cập thời bấy giờ cũng hiếm khi có được.`,`Bí quyết kéo những khối đá 2,5 đến 15 tấn là gì? Các nhà vật lý học thuộc Đại học Amsterdam đã phát hiện: khi đổ một lượng nước vừa đủ lên cát sa mạc phía trước xe trượt gỗ, các hạt cát sẽ liên kết lại thành bề mặt cứng, giảm lực cản ma sát tới 50%!`]},{id:`blog-2`,title:`Làm sao để nhớ các loại đất ở Việt Nam trong 5 phút?`,slug:`meo-nho-cac-loai-dat-viet-nam`,excerpt:`Bí kíp "thần thánh" dùng công thức 3 màu & sơ đồ tư duy giúp bạn không bao giờ nhầm lẫn đất feralit và đất phù sa trong bài kiểm tra!`,tags:[`#MẹoHọcHay`,`#ĐịaLíTựNhiên`,`#BíKípHọcĐường`],author:`Cô Phan Lê Ngọc Diệu`,date:`25/09/2026`,readTime:`4 phút đọc`,coverGradient:`from-emerald-600 via-teal-500 to-green-400`,icon:`🌱`,relatedSubject:`geography`,keyTakeaways:[`Feralit = Fe (Sắt - đỏ) + Al (Nhôm - vàng): Đất vùng đồi núi, chua, thích hợp cây công nghiệp.`,`Phù sa = Sông ngòi bồi đắp: Đất đồng bằng, màu mỡ, vựa lúa gạo & hoa màu.`,`Quy tắc 65-24: Đất feralit chiếm 65%, đất phù sa chiếm 24% diện tích.`],content:[`Học sinh THCS thường dễ bị "rối não" khi phân biệt các nhóm đất: đất feralit trên đá badan, đất feralit trên đá vôi, đất phù sa cổ, đất mặn, đất phèn...`,`Hãy dùng mẹo "Chiết tự hóa học": FERALIT bắt nguồn từ Fe (Sắt) và Al (Nhôm). Ở vùng khí hậu nhiệt đới mưa nhiều, chất kiềm bị rửa trôi, còn lại oxit sắt và nhôm tích tụ tạo ra màu ĐỎ VÀNG đặc trưng!`,`Nhớ vị trí cực dễ: Núi đồi cao thì có đất Feralit (thích hợp cà phê Tây Nguyên, chè Thái Nguyên). Đồng bằng trũng thì có đất Phù sa (vựa lúa miền Tây, rau màu sông Hồng).`]},{id:`blog-3`,title:`Khám phá những rãnh đại dương sâu nhất hành tinh`,slug:`kham-pha-ranh-dai-duong-sau-nhat`,excerpt:`Xuống độ sâu gần 11.000m tại Vực thẳm Challenger rãnh Mariana: Áp suất tương đương 50 chiếc máy bay đè lên người và những sinh vật kỳ lạ phát sáng.`,tags:[`#ĐịaLíTựNhiên`,`#ĐạiDương`,`#ThámHiểm`],author:`HIGEOEDU Explorer`,date:`22/09/2026`,readTime:`6 phút đọc`,coverGradient:`from-blue-900 via-indigo-700 to-cyan-500`,icon:`🌊`,relatedSubject:`geography`,keyTakeaways:[`Rãnh Mariana sâu tới 10.994 mét tại Vực thẳm Challenger ở Tây Thái Bình Dương.`,`Nếu đặt đỉnh núi Everest (8.848m) xuống rãnh Mariana, đỉnh núi vẫn còn chìm sâu dưới hơn 2km nước!`,`Nhiệt độ nước chỉ từ 1 đến 4 độ C và hoàn toàn tối đen như mực.`],content:[`Đại dương chiếm hơn 70% bề mặt Trái Đất nhưng con người mới chỉ khám phá được chưa đầy 20% đáy biển sâu.`,`Tại rãnh Mariana, áp suất nước lên tới 1.086 bar – gấp hơn 1.000 lần áp suất khí quyển ở mực nước biển. Tuy nhiên, nơi đây không hề là "sa mạc không sự sống".`,`Các tàu lặn thám hiểm sâu như Trieste và Deepsea Challenger đã phát hiện những loài cá ốc trong suốt, tôm giáp xác khổng lồ và vi khuẩn hóa tổng hợp lấy năng lượng từ các miệng phun thủy nhiệt sulfur.`]},{id:`blog-4`,title:`Bí ẩn “Tam giác Quỷ” Bermuda: Do từ trường Trái Đất hay chỉ là sự trùng hợp?`,slug:`bi-an-tam-giac-quy-bermuda`,excerpt:`Giải mã vùng biển giữa Miami, Bermuda và Puerto Rico dưới góc nhìn địa lí tự nhiên, dòng hải lưu Gulf Stream và các túi khí methane.`,tags:[`#ĐịaLíThếGiới`,`#BíẨnKhoaHọc`,`#ĐịaLíTựNhiên`],author:`Dương Khánh Duy & Duy Long`,date:`19/09/2026`,readTime:`5 phút đọc`,coverGradient:`from-slate-900 via-cyan-900 to-teal-700`,icon:`🧭`,relatedSubject:`geography`,keyTakeaways:[`Dòng hải lưu Gulf Stream chảy cực xiết qua khu vực, có thể xóa sạch mọi dấu vết mảnh vỡ tàu bè chỉ trong vài giờ.`,`Bong bóng khí methane phun trào từ đáy biển có thể làm giảm mật độ nước đột ngột khiến tàu thuyền bị chìm nhanh chóng.`,`Thống kê của lực lượng Tuần duyên Hoa Kỳ cho thấy tỉ lệ tai nạn tại Bermuda không cao hơn bất kỳ vùng biển bận rộn nào khác trên thế giới.`],content:[`Hàng chục năm qua, "Tam giác quỷ Bermuda" đã trở thành nguồn cảm hứng bất tận cho các giả thuyết về UFO hay cổng dịch chuyển không gian.`,`Nhưng dưới con mắt của một nhà địa lí học, đây là một khu vực có điều kiện khí tượng vô cùng đặc biệt. Hải lưu Gulf Stream (dòng hải lưu nóng vịnh Mexico) chảy qua đây với tốc độ lên đến 9 km/h, đủ mạnh để tạo ra những đợt sóng độc cao hàng chục mét khi gặp gió bão.`,`Ngoài ra, hiện tượng dị thường từ trường địa phương cũng khiến các kim la bàn cơ học cổ điển có thể lệch hướng vài độ so với Bắc thực.`]},{id:`blog-5`,title:`Top 5 hang động kỳ vĩ nhất Việt Nam mà “hội mê xê dịch” nhất định phải biết`,slug:`top-5-hang-dong-ky-vi-nhat-viet-nam`,excerpt:`Hành trình chiêm ngưỡng kỳ quan karst đá vôi triệu năm: Sơn Đoòng, Động Phong Nha, Hang Én, Tam Cốc Bích Động và Hang Tiên.`,tags:[`#ĐịaLíViệtNam`,`#TựHàoQuêHương`,`#ĐịaHìnhKarst`],author:`HIGEOEDU Explorer`,date:`16/09/2026`,readTime:`6 phút đọc`,coverGradient:`from-teal-800 via-emerald-600 to-lime-500`,icon:`⛰️`,relatedSubject:`geography`,keyTakeaways:[`Hang Sơn Đoòng (Quảng Bình) là hang động tự nhiên lớn nhất thế giới, chứa được cả một tòa nhà 40 tầng hoặc cả khu phố New York!`,`Sơn Đoòng sở hữu hệ sinh thái rừng nguyên sinh, mây mù và sông ngầm riêng biệt ngay trong lòng hang.`,`Việt Nam là một trong những quốc gia sở hữu địa hình karst đá vôi hoàn mỹ và cổ xưa nhất thế giới (hình thành từ 400 triệu năm trước).`],content:[`Việt Nam được mẹ thiên nhiên ưu ái ban tặng một "vương quốc hang động" vô tiền khoáng hậu. Nổi bật nhất là Vườn quốc gia Phong Nha - Kẻ Bàng – Di sản Thiên nhiên Thế giới.`,`Sơn Đoòng có thể tích lên tới 38,5 triệu mét khối. Khi bước vào bên trong, du khách ngỡ ngàng khi thấy những khối măng đá cao hơn 70 mét (gọi là "Bức tường Việt Nam") và cả một cánh rừng ngầm rậm rạp được ánh sáng chiếu qua các hố sụt (Doline).`,`Đó là minh chứng sống động nhất cho sức mạnh bào mòn của dòng nước ngầm qua hàng trăm triệu năm lịch sử địa chất.`]},{id:`blog-6`,title:`Tuyệt chiêu “hack” trí nhớ: Thuộc lòng 63 tỉnh thành Việt Nam qua các câu vần`,slug:`tuyet-chieu-hack-tri-nho-63-tinh-thanh`,excerpt:`Bài vè địa lí siêu vui giúp học sinh THCS nhớ ngay các vùng kinh tế Bắc Bộ, Duyên hải Miền Trung, Tây Nguyên và Đồng bằng Nam Bộ.`,tags:[`#BíKípHọcĐường`,`#ĐịaLíViệtNam`,`#MẹoHọcHay`],author:`Dương Khánh Duy`,date:`12/09/2026`,readTime:`4 phút đọc`,coverGradient:`from-violet-600 via-purple-500 to-pink-500`,icon:`📝`,relatedSubject:`geography`,keyTakeaways:[`Ghi nhớ theo 7 vùng sinh thái tự nhiên giúp tư duy mạch lạc.`,`Sử dụng các cặp vần thơ lục bát vui nhộn về đặc sản từng vùng.`,`Kết hợp vẽ phác thảo bản đồ tư duy hình chữ S.`],content:[`Làm thế nào để nhớ hết 63 tỉnh thành mà không bị lộn xộn? Bí kíp chính là: CHIA ĐỂ TRỊ!`,`Thay vì học thuộc lòng một danh sách dài dằng dặc, hãy chia bản đồ thành 7 vùng địa lí: Đông Bắc, Tây Bắc, Đồng bằng sông Hồng, Bắc Trung Bộ, Duyên hải Nam Trung Bộ, Tây Nguyên và Đông Nam Bộ - Tây Nam Bộ.`,`Ghép các tỉnh với món ăn đặc sản hoặc danh lam thắng cảnh: "Thái Nguyên chè ngọt thơm lừng / Tuyên Quang Na Hang điệp trùng rừng cây / Hà Giang Cột Cờ mây bay / Lạng Sơn ải Bắc những ngày hiển vinh..."`]},{id:`blog-7`,title:`Vẽ sơ đồ tư duy Lịch sử siêu đẹp chỉ với 3 cây bút màu`,slug:`ve-so-do-tu-duy-lich-su-3-cay-but-mau`,excerpt:`Phương pháp Mindmap trực quan: 1 bút viền mốc thời gian, 1 bút nổi bật sự kiện, 1 bút ghi nhớ bài học ý nghĩa.`,tags:[`#PhươngPhápHọc`,`#SơĐồTưDuy`,`#GenZEdTech`],author:`Nguyễn Duy Long`,date:`08/09/2026`,readTime:`5 phút đọc`,coverGradient:`from-amber-500 via-rose-500 to-indigo-600`,icon:`🎨`,relatedSubject:`history`,keyTakeaways:[`Màu Đỏ: Dành cho các chiến dịch quân sự, mốc thời gian bước ngoặt.`,`Màu Xanh: Dành cho địa điểm, chiến lược và lực lượng tham gia.`,`Màu Vàng: Dành cho ý nghĩa lịch sử, bài học kinh nghiệm và danh nhân.`],content:[`Nhiều bạn than thở rằng môn Lịch sử có quá nhiều con số và sự kiện dài khó nhớ. Nhưng khi chuyển kiến thức thành dạng hình ảnh (Visual Thinking), não bộ sẽ tiếp thu nhanh gấp 6 lần!`,`Chỉ cần chuẩn bị 1 trang giấy trắng A4 nằm ngang và 3 cây bút highlight:`,`Bước 1: Vẽ trung tâm là sự kiện cốt lõi (ví dụ: Trận Bạch Đằng 938).`,`Bước 2: Tỏa ra 4 nhánh chính: Hoàn cảnh -> Diễn biến -> Kết quả -> Ý nghĩa.`,`Bước 3: Dùng icon vui nhộn (thuyền buồm, cọc gỗ, vương miện) thay cho câu chữ dài dòng.`]},{id:`blog-8`,title:`Điện Biên Phủ: Trận đánh khiến cả thế giới phải “Wow”!`,slug:`dien-bien-phu-tran-danh-khien-the-gioi-phai-wow`,excerpt:`Nghệ thuật ngụy trang công sự, kéo pháo bằng sức người qua đèo dốc, xe đạp thồ thần kỳ và bài toán hậu cần thiên tài của quân dân ta.`,tags:[`#LịchSửViệtNam`,`#HuyềnThoại`,`#ĐiệnBiênPhủ`],author:`HIGEOEDU Explorer`,date:`03/09/2026`,readTime:`7 phút đọc`,coverGradient:`from-red-700 via-rose-600 to-amber-500`,icon:`⚔️`,relatedSubject:`history`,keyTakeaways:[`Quyết định đổi phương châm tác chiến lịch sử từ "Đánh nhanh thắng nhanh" sang "Đánh chắc tiến chắc" của Đại tướng Võ Nguyên Giáp.`,`Đoàn quân xe đạp thồ (mỗi chiếc chở tới hơn 300kg lương thực) khiến phương Tây kinh ngạc.`,`Hệ thống chiến hào dài hàng trăm km thắt chặt thòng lọng quanh cứ điểm địch.`],content:[`Các tướng lĩnh quân sự hàng đầu thế giới thời bấy giờ đều khẳng định Điện Biên Phủ là một "pháo đài bất khả xâm phạm", một "cối xay thịt" có thể nghiền nát mọi lực lượng tiến công.`,`Nhưng họ đã tính toán thiếu một biến số quan trọng nhất: Ý CHÍ QUẬT CƯỜNG VÀ TRÍ TUỆ CỦA DÂN TỘC VIỆT NAM!`,`Hàng vạn dân công hỏa tuyến đã dùng những chiếc xe đạp thồ thô sơ băng qua đèo Pha Đin, đèo Lũng Lô tiếp tế hàng vạn tấn gạo và đạn dược.`,`Bộ đội ta dùng sức người kéo những cỗ pháo nặng hơn 2 tấn lên những vách núi dựng đứng, rồi đào chiến hào vây lấn từng mét đất, siết chặt vòng vây bóp nghẹt sân bay Mường Thanh.`]},{id:`blog-9`,title:`Ngày 2/9/1945: Bản Tuyên ngôn Độc lập và “Tín hiệu truyền thanh” chấn động thế giới!`,slug:`ngay-2-9-1945-ban-tuyen-ngon-doc-lap`,excerpt:`Khoảnh khắc Bác Hồ dừng lại hỏi: "Tôi nói đồng bào nghe rõ không?" và ý nghĩa thời đại của bản Tuyên ngôn lịch sử tại Quảng trường Ba Đình.`,tags:[`#MốcSonChóiLọi`,`#TựHàoViệtNam`,`#BácHồ`],author:`Nhóm Tác giả HIGEOEDU`,date:`30/08/2026`,readTime:`6 phút đọc`,coverGradient:`from-red-600 via-amber-600 to-yellow-500`,icon:`🇻🇳`,relatedSubject:`history`,keyTakeaways:[`Bản Tuyên ngôn khẳng định quyền con người gắn liền hữu cơ với quyền độc lập tự do của mọi dân tộc trên thế giới.`,`Mở đầu bằng việc trích dẫn Tuyên ngôn Độc lập 1776 của Mỹ và Tuyên ngôn Nhân quyền 1789 của Pháp, đặt Việt Nam ngang hàng với các cường quốc văn minh.`,`Khai sinh ra nhà nước công nông đầu tiên ở Đông Nam Á.`],content:[`Trưa mùa thu ngày 2 tháng 9 năm 1945, thủ đô Hà Nội rực rỡ cờ đỏ sao vàng. Biển người đổ về Quảng trường Ba Đình với ánh mắt rạng ngời niềm tin yêu.`,`Khi Chủ tịch Hồ Chí Minh bước lên lễ đài cất giọng trầm ấm, giữa bài đọc Bác dừng lại hỏi một câu thật giản dị, thân thương: "Tôi nói đồng bào nghe rõ không?". Hơn 50 vạn người đồng thanh hô vang: "Rõ!". Tiếng đáp ấy làm rung chuyển cả không gian Ba Đình lịch sử.`,`Đó là giây phút đánh dấu non sông ta rũ bùn đứng dậy sáng lòa, bước vào kỷ nguyên độc lập tự chủ.`]},{id:`blog-10`,title:`Ngày 30/4/1975: Cú húc cổng Dinh Độc Lập và 11 giờ 30 phút nghẹt thở!`,slug:`ngay-30-4-1975-cu-huc-cong-dinh-doc-lap`,excerpt:`Khoảnh khắc xe tăng 390 lao qua cánh cổng sắt, lá cờ chiến thắng tung bay trên nóc Dinh Độc Lập khép lại cuộc kháng chiến trường kỳ 30 năm.`,tags:[`#ĐạiThắngMùaXuân`,`#ThốngNhấtĐấtNước`,`#NonSôngLiềnMộtDải`],author:`Nhóm Tác giả HIGEOEDU`,date:`25/08/2026`,readTime:`6 phút đọc`,coverGradient:`from-amber-600 via-red-600 to-rose-700`,icon:`🚩`,relatedSubject:`history`,keyTakeaways:[`11 giờ 30 phút ngày 30/4/1975: Lá cờ cách mạng tung bay trên nóc Dinh Độc Lập.`,`Chiến dịch Hồ Chí Minh lịch sử toàn thắng, miền Nam hoàn toàn giải phóng.`,`Non sông thu về một mối, kết thúc 21 năm kháng chiến chống Mỹ và 30 năm chiến tranh giải phóng dân tộc.`],content:[`Sáng ngày 30 tháng 4 năm 1975, năm cánh quân giải phóng thần tốc tiến vào trung tâm Sài Gòn.`,`Tại cổng Dinh Độc Lập, chiếc xe tăng mang số hiệu 390 do Trung úy Vũ Đăng Toàn chỉ huy và lái xe Ngô Sĩ Nguyên điều khiển đã dồn hết ga, húc đổ cánh cổng sắt kiên cố, mở đường tiến thẳng vào dinh thự.`,`Đồng chí Bùi Quang Thận nhanh chóng chạy lên nóc dinh hạ cờ chính quyền Sài Gòn, giương cao lá cờ Mặt trận Dân tộc Giải phóng miền Nam Việt Nam. Đúng 11 giờ 30 phút, tiếng súng ngưng hẳn, hòa bình và thống nhất đã về trọn vẹn trên quê hương!`]}],et=[{rank:1,name:`Minh Anh`,xp:2450,level:6,avatar:`👩‍🎓`,badge:`🧠 Bậc thầy ghi nhớ`,streak:14},{rank:2,name:`Hoàng Nam`,xp:2210,level:5,avatar:`🧑‍🚀`,badge:`🌍 Nhà địa lí nhí`,streak:10},{rank:3,name:`Gia Hân`,xp:1980,level:5,avatar:`👧`,badge:`🗺️ Nhà thám hiểm bản đồ`,streak:9},{rank:4,name:`Tuấn Anh`,xp:1850,level:4,avatar:`👦`,badge:`🏅 Nhà sử học nhí`,streak:8},{rank:5,name:`Ngọc Mai`,xp:1720,level:4,avatar:`🧒`,badge:`⚡ Vua giải mã mật mã`,streak:6},{rank:8,name:`Bạn (Nhà thám hiểm nhí)`,xp:1250,level:3,avatar:`🧭`,badge:`🔥 7 ngày học liên tiếp`,streak:7,isCurrentUser:!0}],tt=({stats:e,onClose:t})=>(0,j.jsx)(`div`,{className:`fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200`,children:(0,j.jsxs)(`div`,{className:`bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-amber-200 space-y-6 flex flex-col max-h-[90vh]`,children:[(0,j.jsxs)(`div`,{className:`flex items-center justify-between pb-3 border-b border-slate-100`,children:[(0,j.jsxs)(`div`,{className:`flex items-center gap-2.5`,children:[(0,j.jsx)(`div`,{className:`w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center font-bold text-lg shadow-xs`,children:`🏅`}),(0,j.jsxs)(`div`,{children:[(0,j.jsx)(`h3`,{className:`font-black text-lg text-slate-900 leading-tight`,children:`Kho Huy Hiệu Thám Hiểm`}),(0,j.jsx)(`p`,{className:`text-xs text-slate-500`,children:`Thành tích học tập môn Sử – Địa của bạn`})]})]}),(0,j.jsx)(`button`,{onClick:t,className:`p-1 rounded-full hover:bg-slate-100 text-slate-400 cursor-pointer`,children:(0,j.jsx)
